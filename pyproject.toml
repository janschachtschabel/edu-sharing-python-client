[project]
name = "edu-sharing-python-client"
version = "0.0.1"
description = "Python client for edu-sharing repositories and the b-api -- repository-agnostic, async-first"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["edu-sharing", "openeduhub", "wirlernenonline", "oer", "metadata", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]

dependencies = [
    "httpx>=0.27",
    # Runtime dependencies of the generated layer (openapi-python-client):
    "attrs>=23.2",
    "python-dateutil>=2.9",
    "typing-extensions>=4.10",
]

[project.urls]
Repository = "https://github.com/janschachtschabel/edu-sharing-python-client"
Issues = "https://github.com/janschachtschabel/edu-sharing-python-client/issues"
Changelog = "https://github.com/janschachtschabel/edu-sharing-python-client/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edusharing"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Network access is never the default: `pytest` runs offline and
# deterministically. Ask for live tests explicitly with `pytest -m live`.
addopts = "-m 'not live and not write'"
markers = [
    "live: talks to a real instance (needs EDU_SHARING_URL)",
    "write: WRITES into a repository (needs credentials and a throwaway folder)",
]

[tool.ruff]
line-length = 100
src = ["src"]
# The generated layer is never touched by hand.
extend-exclude = ["src/edusharing/_generated"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "UP",        # outdated spellings
    "B",         # common traps (bugbear)
    "PIE",       # redundant constructs
    "PYI",       # type annotations
    "RUF",       # ruff's own rules
    "C90",       # cyclomatic complexity
]
ignore = [
    # __all__ is grouped and commented by topic in this library (entry point /
    # credentials / errors), not sorted alphabetically. The grouping tells a
    # reader more than the ordering would.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# The test doubles are fake HTTP servers: one flat dispatch on method and path,
# read top to bottom. Cutting that into thirty functions to satisfy a
# complexity limit would hide the shape instead of showing it. The limit is
# about what a maintainer has to reason about in the library.
"tests/*" = ["C901"]

[tool.ruff.lint.mccabe]
# _text_score sat at 15 and read as one wall of scoring rules (audit F6). Ten
# is the usual line; the whole hand-written layer is under it, so keeping it
# there costs nothing and says when a function has grown a second job.
max-complexity = 10

[dependency-groups]
# One place for dev dependencies (PEP 735). They were split across
# optional-dependencies and this group before, so `pip install -e .[dev]` and
# `uv sync` installed different sets (audit F9).
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "openapi-python-client>=0.29",
]

[tool.mypy]
# The settings live here so CI and a local run check the same thing.
files = ["src/edusharing"]
# Machine output: it is regenerated, never edited, and carries its own style.
exclude = ["src/edusharing/_generated/"]
# httpx ships types; the generated client's helpers do not.
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/edusharing"]
# The generated layer is never hand-written and never hand-tested; including it
# would drown the real figure (54,570 statements against roughly 1,200).
omit = ["*/_generated/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\.\.\.',
]
