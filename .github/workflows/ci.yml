name: CI

# Every guarantee this library makes -- the read-back checks, the encoded path
# segments, the credential boundary -- rests on the suite being run. Locally
# that depends on someone remembering (audit F8).

on:
  push:
  pull_request:

# Read-only by default. The workflow builds and tests; it publishes nothing,
# comments nowhere, and pushes no tag, so the token it runs under should be
# able to do none of those either (audit OPS-2).
permissions:
  contents: read

# One run per branch. A second push while the first is still going makes the
# first answer stale, and a stale green is worse than no answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # The suite takes about a minute. Fifteen is room for a slow runner and a
    # ceiling on a hung job, which otherwise blocks the queue for six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The package promises >=3.11. A promise nobody checks is a guess.
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # One Windows leg. The library is developed on Windows and used
          # there, but CI only ever ran on Linux -- so the cp1252 default
          # encoding, the CRLF line endings and the backslash paths, the whole
          # class of bug that only shows up there, never ran here (audit
          # OPS-2). One version is enough to catch it; four would only pay
          # four times for the same answer.
          - os: windows-latest
            python: "3.13"

    steps:
      # Actions pinned by commit, not by tag: a tag can be moved, and then
      # what runs here is whatever someone points it at (audit OPS-2). The
      # comment names the version the SHA stood for when it was pinned.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}

      # Pinned for the same reason as the actions: an unpinned installer is a
      # dependency nobody declared.
      - name: Install uv
        run: pip install uv==0.12.10

      # --locked: install exactly what uv.lock pins AND assert the lock still
      # matches pyproject.toml. --frozen stood here and only did the first
      # half: a pyproject change without a lock update passed silently, which
      # is precisely what this step promised to catch (audit OPS-1).
      # --python: without it uv picks its own interpreter and the matrix would
      # test the same version four times.
      - name: Install dependencies
        run: uv sync --group dev --locked --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      # Ruff reads style, mypy reads types -- different questions. It found a
      # json.loads on a value that could be None and an int() that relied on
      # catching TypeError; both were correct by accident of a guard written
      # so the checker could not see it (audit F5).
      - name: Type check
        run: uv run mypy

      # --skip-editable leaves out the project itself: it is installed editable
      # and is not on PyPI, which pip-audit reports as an error rather than a
      # clean run. Everything it depends on is still audited -- verified by
      # pinning a known-vulnerable jinja2, which produced 5 findings.
      - name: Audit dependencies
        run: uv run --with pip-audit==2.10.1 pip-audit --skip-editable

      # Offline only. The live and write suites need credentials and write into
      # a real repository -- they are deselected by addopts in pyproject.toml
      # and stay a deliberate, local act.
      #
      # The failure summary is repeated as an error annotation because the run
      # log needs a sign-in to read, while annotations are public. The first
      # Windows run failed on 2026-09-08 and left an exit code and nothing
      # else; a red build nobody can read is barely better than no build.
      - name: Tests
        shell: bash
        run: |
          set +e
          uv run pytest -q --tb=short 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            printf '::error title=pytest::%s\n' \
              "$(tail -n 40 pytest.log | tr -d '\r' | sed 's/%/%25/g' \
                 | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$rc"

  # --- 5.4 der Fremdpruefung vom 09.09.2026 ---------------------------------
  #
  # Die Suite prueft den Quelltext. Sie prueft nicht, ob daraus ein Paket
  # wird, das sich installieren laesst, und nicht, ob die eingecheckte
  # generierte Schicht noch die ist, die aus der Spec faellt. Beides lief in
  # der Pruefung erfolgreich -- als Gate haette das zweite F15 frueher
  # gezeigt.

  package:
    # Ein Wheel, das sich nicht installieren oder nicht importieren laesst,
    # faellt sonst erst beim ersten Anwender auf. Eine Python-Fassung genuegt:
    # die Frage ist "wird daraus ein Paket", nicht "laeuft der Code".
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.12.10

      - name: Build
        run: uv build

      # In einer eigenen Umgebung, ohne das Projektverzeichnis: sonst importiert
      # der naechste Schritt den Quelltext daneben statt des Wheels und
      # beantwortet eine andere Frage.
      - name: Install the wheel
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet dist/*.whl

      # Jedes Modul, nicht nur das Paket: die generierte Schicht sind 1131
      # Dateien, und ein kaputter Import darin faellt beim Import des Pakets
      # nicht auf.
      - name: Import every module
        run: |
          cd /tmp
          /tmp/wheeltest/bin/python - <<'PY'
          import importlib, pkgutil, sys
          import edusharing
          fehler = []
          for modul in pkgutil.walk_packages(edusharing.__path__, "edusharing."):
              try:
                  importlib.import_module(modul.name)
              except Exception as exc:  # noqa: BLE001 -- jeder Grund zaehlt
                  fehler.append(f"{modul.name}: {type(exc).__name__}: {exc}")
          print(f"{len(sys.modules)} Module geladen, {len(fehler)} Fehler")
          for f in fehler[:20]:
              print("   ", f)
          sys.exit(1 if fehler else 0)
          PY

  generate:
    # Erzeugt die Schicht neu und verlangt einen sauberen Diff. Ohne das Gate
    # ist "regenerierbar" eine Behauptung: die eingecheckten Dateien koennen
    # von Hand geaendert worden sein, oder der Erzeugungsweg kann sich
    # geaendert haben, ohne dass jemand neu erzeugt hat.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv==0.12.10
      - name: Install dependencies
        run: uv sync --group dev --locked --python 3.13

      - name: Regenerate
        run: uv run python scripts/generate_client.py

      # ``--exit-code`` liest den Diff als Ergebnis, nicht als Text. Der Name
      # der ersten abweichenden Datei steht in der Ausgabe darueber.
      - name: The checked-in layer is the generated one
        run: |
          git --no-pager diff --stat -- src/edusharing/_generated
          git diff --exit-code -- src/edusharing/_generated
